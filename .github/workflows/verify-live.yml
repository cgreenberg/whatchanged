name: Verify live data

on:
  schedule:
    - cron: '0 14 * * 2' # Tuesday 14:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify live site against BLS and EIA
        id: verify
        run: npm run verify:live 2>&1 | tee verify-output.txt; exit "${PIPESTATUS[0]}"
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Weekly live verification failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```'
            grep -E ' FAIL |SUMMARY' verify-output.txt | head -60 || true
            echo '```'
          } > issue-body.md
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "verify:live failed ($(date -u +%F))" \
            --body-file issue-body.md
