name: Refresh local data (Zillow, Realtor.com, QCEW, LAUS, CPI, permits)

on:
  schedule:
    - cron: '0 15 20 * *' # 20th of each month: after Zillow (~mid-month) and BLS CPI/LAUS releases
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      # Hash-pinned (incl. transitive deps). Regenerate with:
      #   uv pip compile scripts/requirements-local-data.in --generate-hashes --python-version 3.12 \
      #     --python-platform x86_64-unknown-linux-gnu -o scripts/requirements-local-data.txt
      - run: pip install --require-hashes --no-deps -r scripts/requirements-local-data.txt
      - name: Require BLS_CONTACT_EMAIL
        env:
          BLS_CONTACT_EMAIL: ${{ secrets.BLS_CONTACT_EMAIL }}
        run: |
          if [ -z "$BLS_CONTACT_EMAIL" ]; then
            echo "::error::Repository secret BLS_CONTACT_EMAIL is not set. download.bls.gov returns 403 without a contact email in the User-Agent; set it to a monitored inbox."
            exit 1
          fi
      - run: scripts/fetch-local-data.sh /tmp/raw
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          BLS_CONTACT_EMAIL: ${{ secrets.BLS_CONTACT_EMAIL }}
      - run: python3 scripts/build-local-data.py --raw /tmp/raw --out public/data
      - name: Validate (fails the run on any FAIL check)
        run: python3 scripts/validate-local-data.py --raw /tmp/raw --data public/data --out docs/validation
      - uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          branch: data/local-refresh
          base: main
          title: 'data: monthly local data refresh'
          commit-message: 'data: monthly local data refresh'
          body-path: docs/validation/report.md
